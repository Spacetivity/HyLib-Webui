name: Sync develop with production

on:
  pull_request:
    types: [closed]
    branches:
      - production

jobs:
  sync-develop:
    runs-on: ubuntu-latest
    # Nur ausführen wenn PR gemerged wurde und von develop kam
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Vollständige History für Branch-Operationen
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Fetch all branches
        run: git fetch origin
      
      - name: Checkout develop
        run: git checkout develop
      
      - name: Fast-forward develop to production
        run: |
          git merge --ff-only origin/production
      
      - name: Push updated develop
        run: |
          git push origin develop
